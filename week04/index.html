<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Form</title>
  <link rel="stylesheet" href="styles/normalize.css">
  <link rel="stylesheet" href="styles/form.css">
</head>
<body>
  <main>
    <h1>Schedule an Appointment</h1>
    <form method="GET" action="thanks.html" class="designOne">
      
      <label>First Name <input type="text" name="first" required autocomplete="given-name" title="Your First Name"></label>
      <label>Last Name <input type="text" name="last" required autocomplete="family-name" title="Your Last Name"></label>
      <label>Cell Phone <input type="tel" name="phone" required autocomplete="tel" title="A Phone Number with dashes" placeholder="987-555-1234"></label>
      <label>Email <input type="email" name="email" required placeholder="john89@gmail.com" title="Your Email"></label>
      
      <h3>Select Service</h3>
      <label><input type="radio" name="service" value="oil" checked> Oil Change</label>
      <label><input type="radio" name="service" value="tires"> Tire Rotation</label>
      <label><input type="radio" name="service" value="brakes"> Brake Check</label>

      <label>Appointment Date <input type="date" name="date" required></label>
      
      <label>How many vehicles? 
        <select name="vehicles" required>
          <option value="">Please Select &#9662;</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
      </label>

      <label>Special Instructions
        <textarea name="instructions" title="Any special instructions"></textarea>
      </label>

      <input type="submit" value="Schedule My Appointment">
    </form>
    </main>
    <p>&copy; <span id="currentYear"></span> | Teckler N Makomeke | South Africa</p>
                        <p>Last Modification: <span id="lastModified"></span></P>
    </footer>
</body>     
</html>
