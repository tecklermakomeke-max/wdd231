<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modules Example</title>
    <link rel="stylesheet" href="styles/modules.css">
    <script type="module" src="scripts/modules.mjs" defer></script>
    <script type="module" src="scripts/course.mjs" defer></script>
    <script type="module" src="scripts/output.mjs" defer></script>
    <script type="module" src="scripts/sections.mjs" defer></script>
</head>
<body>
   <main>
    <h1 id="courseTitle"></h1>
     <label for="sectionNumber">Section:</label>
     <select id="sectionNumber"></select>
     <button id="enrollStudent">Enroll Student</button>
     <button id="dropStudent">Drop Student</button>
     <table>
        <thead>
            <tr>
                <th>Section</th>
                <th>Room</th>
                <th># Enrolled</th>
                <th>Days</th>
                <th>Instructor></th>
            </tr>
        </thead>
        <tbody id="sections"></tbody>
     </table>
   </main> 
</body>
</html>
